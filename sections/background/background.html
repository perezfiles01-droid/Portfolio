<h2 class="panel-title">Background</h2>

<div class="bg-stage">

  <div class="bg-left">
    <div class="bg-shot" data-shot hidden>
      <span class="bg-scan" aria-hidden="true"></span>
      <span class="bg-corner tl" aria-hidden="true"></span>
      <span class="bg-corner br" aria-hidden="true"></span>
      <span class="bg-plate" data-plate></span>
    </div>
    <ul class="bg-meta" data-meta></ul>
  </div>

  <div class="bg-right">
    <h1 class="bg-name" data-name></h1>
    <p class="bg-role" data-role></p>
    <p class="bg-summary" data-summary></p>
    <div class="bg-rows" data-timeline></div>
  </div>

</div>
