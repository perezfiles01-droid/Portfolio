<canvas class="hero-aurora" data-aurora aria-hidden="true"></canvas>

<div class="hero-inner">

  <p class="hero-eyebrow" data-eyebrow></p>

  <div class="hero-grid">
    <div class="hero-copy">
      <h1 class="hero-display" data-display></h1>
      <p class="hero-name" data-name></p>
      <p class="hero-sub" data-sub></p>

      <ul class="hero-stats" data-stats></ul>

      <button class="hero-cta" type="button" data-cta>
        <span data-cta-label></span>
        <span class="hero-cta-arrow" aria-hidden="true">&darr;</span>
      </button>
    </div>

    <figure class="hero-portrait" data-portrait hidden>
      <img class="hero-photo" data-photo alt="">
    </figure>
  </div>

  <p class="hero-hint" data-hint></p>

</div>
